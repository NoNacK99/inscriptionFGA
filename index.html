<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulaires d'inscription</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --jaune:#f0c419; --gris:#d9d9d9; --texte:#222; }
  * { box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; color:var(--texte); margin:0; background:#f4f4f4; font-size:17px; }
  main { max-width:900px; margin:0 auto; padding:12px; background:#fff; }
  h1 { font-size:1.4rem; text-align:center; margin:8px 0 6px; }
  .consigne { text-align:center; font-size:.95rem; margin:0 0 16px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .carte { border:2px solid var(--gris); border-radius:8px; padding:12px; text-align:center; break-inside:avoid; }
  .carte h2 { font-size:1rem; margin:0 0 10px; min-height:2.4em; }
  .qr { display:flex; justify-content:center; margin-bottom:10px; }
  .carte a { display:block; background:var(--jaune); color:#000; font-weight:bold; text-decoration:none; padding:12px; border-radius:8px; }
  .impression { display:block; margin:16px auto 0; font-size:1rem; padding:12px 18px; border:0; border-radius:8px; background:var(--gris); cursor:pointer; }
  @media print { body { background:#fff; } .impression { display:none; } .carte a { display:none; } }
</style>
</head>
<body>
<main>
<h1>Formulaires d'inscription</h1>
<p class="consigne">Scannez le code de votre service avec l'appareil photo du cellulaire, ou appuyez sur le bouton jaune.</p>
<div class="grille" id="grille"></div>
<button type="button" class="impression" onclick="window.print()">Imprimer cette page</button>
</main>

<script>
const PAGES = [
  { nom: "Formation générale", page: "generale.html" },
  { nom: "Formation continue", page: "continue.html" },
  { nom: "Semi-spécialisé", page: "semi.html" },
  { nom: "Intégration socioprofessionnelle", page: "socioprofessionnelle.html" },
  { nom: "Intégration sociale", page: "sociale.html" },
  { nom: "Préinscription", page: "preinscription.html" },
  { nom: "Francisation", page: "francisation.html" }
];

const grille = document.getElementById("grille");
PAGES.forEach(p => {
  /* Adresse absolue calculée à partir de l'emplacement de cette page, sans ?test */
  const url = new URL(p.page, location.href).href;
  const carte = document.createElement("div");
  carte.className = "carte";
  carte.innerHTML = '<h2></h2><div class="qr"></div><a></a>';
  carte.querySelector("h2").textContent = p.nom;
  const lien = carte.querySelector("a");
  lien.href = url;
  lien.textContent = "Ouvrir le formulaire";
  grille.appendChild(carte);
  new QRCode(carte.querySelector(".qr"), {
    text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M
  });
});
</script>
</body>
</html>
